        analysisId: 40000000-0000-4000-8000-000000000002
        documentId: 30000000-0000-4000-8000-000000000002
        title: submission.txt
        createdAt: '2026-11-13T12:01:00Z'
        completedAt: '2026-11-13T12:01:01Z'
        profile: STANDARD
        sourceCount: 0
        status: COMPLETED
        documentText: Local evidence requires careful human review.
        result:
          engineVersion: local-evidence-1.0
          profile: STANDARD
          wordCount: 6
          exactOverlap: 0.0
          nearOverlap: 0.0
          totalOverlap: 0.0
          matches: []
          citations: []
          limitations:
            - 'Only supplied corpus text is searched; no web or repository search. Overlap is evidence, not a plagiarism verdict.'
            - 'NFKC compatibility/case/whitespace normalization removes invisible formatting and soft hyphens; offsets remain original UTF-16 half-open ranges.'
            - 'Exact normalized word shingles require 8 words; short, low-diversity and known boilerplate shingles are suppressed. Fingerprint tokens longer than 64 characters are omitted.'
            - 'Coverage fractions use unions of normalized words in retained evidence: exact first, near only additional words, total their union. Near windows do not imply every word was copied.'
            - 'Limits: 50 sources, 200000 characters per text, 1000000 corpus characters, 200 matches, 2000 characters and 160 words per exact passage; retrieval budgets can omit evidence.'
            - 'Near evidence is lexical content-word set Jaccard >= 0.62 with >= 5 shared terms on 6..80-word sentence/paragraph windows; up to 12 query terms, 200 candidates, 24 reranked and 3 retained per window. Not semantic similarity.'
            - 'Reference lists remain in the covered-word denominator and matching for this profile.'
            - 'Citations, quotations and reference lists are heuristic, uncertain observations; no attribution or bibliographic validation. Quoted/cited prose is not automatically exempted.'
            - 'Page is 1-based from form-feed boundaries only; without them it is 1, not verified rendered pagination. Semantic analysis, OCR and AI-authorship scoring are not implemented.'
